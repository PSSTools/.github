# CA-T1 -- Developer Certificate of Origin check (reusable).
#
# Called by every psstools repository via a ~6-line caller in its own
# .github/workflows/dco.yml. Do NOT copy this body into the repos: eighteen
# copies will not stay in step.
#
# Written here rather than installing the DCO probot app: the logic is thirty
# lines, it avoids granting a third-party app write access to the org, and
# there is exactly one place to fix it.
#
# Runs on `pull_request`, not `pull_request_target`. It needs no write token --
# the verdict is reported by the run's own status -- so the read-only token a
# fork PR gets is sufficient, and no fork-controlled content is ever executed.
name: DCO

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  dco:
    name: Signed-off-by
    runs-on: ubuntu-latest
    steps:
      - name: Check sign-off on every commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$REPO/pulls/$PR/commits" > commits.json
          python3 - <<'PY'
          import json, re, sys

          commits = json.load(open("commits.json"))

          # A trailer anywhere in the message body, one per line. Deliberately
          # lenient about surrounding whitespace and case in the key, because a
          # contributor who typed it by hand rather than using `git commit -s`
          # has still made the certification.
          TRAILER = re.compile(
              r"^\s*signed-off-by:\s*(?P<name>.*?)\s*<(?P<email>[^>]+)>\s*$",
              re.IGNORECASE | re.MULTILINE,
          )

          failures = []
          checked = 0

          for c in commits:
              sha = c["sha"]
              short = sha[:8]

              # Merge commits are skipped. Their content is the sum of commits
              # that were each checked on their own, and their message is
              # generated by git or by GitHub -- there is nobody to certify.
              if len(c.get("parents", [])) > 1:
                  print(f"skip {short}  (merge commit)")
                  continue

              commit = c["commit"]
              message = commit.get("message", "")

              # Accept a sign-off matching EITHER the author or the committer.
              # A maintainer applying a patch on someone's behalf is the case
              # this covers, and it is the same rule the DCO app uses.
              identities = set()
              for role in ("author", "committer"):
                  email = (commit.get(role) or {}).get("email")
                  if email:
                      identities.add(email.strip().lower())

              signers = {m.group("email").strip().lower() for m in TRAILER.finditer(message)}
              checked += 1

              if not signers:
                  failures.append((short, "no Signed-off-by trailer", commit, identities))
              elif not (signers & identities):
                  failures.append((
                      short,
                      "sign-off does not match the author or committer "
                      f"(signed off by: {', '.join(sorted(signers))})",
                      commit, identities,
                  ))
              else:
                  print(f"ok   {short}  {sorted(signers & identities)[0]}")

          if not failures:
              print(f"\nAll {checked} commit(s) signed off.")
              sys.exit(0)

          print(f"\n{len(failures)} of {checked} commit(s) are not signed off:\n")
          for short, why, commit, identities in failures:
              author = commit.get("author") or {}
              print(f"  {short}  {commit.get('message','').splitlines()[0][:60]}")
              print(f"            {why}")
              print(f"            author: {author.get('name')} <{author.get('email')}>")
          print("\n".join([
              "",
              "Every commit needs a `Signed-off-by` trailer matching its author.",
              "This certifies the Developer Certificate of Origin 1.1:",
              "  https://github.com/psstools/.github/blob/main/DCO",
              "",
              "It is not a copyright assignment and it is not a CLA.",
              "",
              "To fix the most recent commit:",
              "",
              "    git commit --amend -s --no-edit",
              "    git push --force-with-lease",
              "",
              "To fix every commit on the branch (use the base branch name):",
              "",
              "    git rebase --signoff origin/main",
              "    git push --force-with-lease",
              "",
              "To sign off automatically from now on use `git commit -s`, with:",
              "",
              "    git config user.name  \"Your Name\"",
              "    git config user.email \"your.email@example.com\"",
              "",
              "Editing files in the GitHub web UI signs off for you.",
              "",
              "See https://github.com/psstools/.github/blob/main/CONTRIBUTING.md#signing-off-dco",
          ]))
          sys.exit(1)
          PY
